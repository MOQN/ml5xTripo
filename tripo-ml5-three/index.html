<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tripo + ml5 + Three.js</title>
  <style>
    body { margin: 0; background: #181818; color: #eee; font: 14px system-ui; }
    canvas { display: block; }
    #controls { position: fixed; top: 16px; left: 16px; z-index: 1; padding: 16px; background: #111e; border-radius: 8px; max-width: 300px; }
    label { display: block; margin: 10px 0; }
    button, select { font: inherit; }
    #status { line-height: 1.5; }
    #preview { position: fixed; bottom: 16px; left: 16px; width: 240px; transform: scaleX(-1); border-radius: 8px; }
  </style>
  <script src="https://unpkg.com/ml5@1.3.1/dist/ml5.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./sketch.js"></script>
</head>
<body>
  <section id="controls" aria-label="Model controls">
    <strong>TripoThree / Native Three.js</strong>
    <label>Model <select id="model"><option value="moon">Moon</option><option value="yinan">Yinan</option></select></label>
    <label><input id="visible" type="checkbox" checked> Show mesh</label>
    <label><input id="skeleton" type="checkbox"> Show skeleton</label>
    <label><input id="mirror" type="checkbox"> Mirror pose</label>
    <label><input id="model-mirror" type="checkbox"> Swap left/right bones</label>
    <label>Trace <select id="trace"><option value="">Off</option><option value="left_wrist">Left wrist</option><option value="right_wrist">Right wrist</option><option value="nose">Nose</option></select></label>
    <button id="camera" type="button">Start webcam + ml5</button>
    <p id="status" role="status">Loading mesh...</p>
    <small>Drag to orbit, scroll to zoom. The box shares the scene with the avatar.</small>
  </section>
</body>
</html>
